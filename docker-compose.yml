services:
  web:
    build: ./backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - source: db_password
        target: db_password
      - source: db_user
        target: db_user
      - source: db_name
        target: db_name
    environment:
      - DB_HOST=db
      - DB_PORT=3306
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect(('127.0.0.1', 8000))"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: mysql:8.0
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb_buffer_pool_size=256M
      --max_connections=50
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$(cat /run/secrets/db_root_password) || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    environment:
      MYSQL_DATABASE: db_estudiantes
      MYSQL_USER_FILE: /run/secrets/db_user
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    ports:
      - "3315:3306"
    secrets:
      - source: db_password
        target: db_password
      - source: db_user
        target: db_user
      - source: db_root_password
        target: db_root_password
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "8501:8501"
    depends_on:
      web:
        condition: service_healthy
    environment:
      - API_URL=http://web:8000

volumes:
  mysql_data:

secrets:
  db_name:
    file: ./secrets/db_name.txt
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt