name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Secretos Temporales para Test
        run: |
          mkdir -p secrets
          echo "test_db" > secrets/db_name.txt
          echo "test_user" > secrets/db_user.txt
          echo "test_pass" > secrets/db_password.txt
          echo "test_root" > secrets/db_root_password.txt

      - name: Ejecutar Pruebas
        run: |
          docker compose build web
          docker compose run --rm --entrypoint "sh -c" web "pip install pytest httpx coverage && export PYTHONPATH=/app && pytest tests/ -v"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Secretos Reales (Bash version)
        env:
          SEC_DB_NAME: ${{ secrets.DB_NAME }}
          SEC_DB_USER: ${{ secrets.DB_USER }}
          SEC_DB_PASS: ${{ secrets.DB_PASSWORD }}
          SEC_ROOT_PASS: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          mkdir -p secrets
          printf "%s" "$SEC_DB_NAME" > secrets/db_name.txt
          printf "%s" "$SEC_DB_USER" > secrets/db_user.txt
          printf "%s" "$SEC_DB_PASS" > secrets/db_password.txt
          printf "%s" "$SEC_ROOT_PASS" > secrets/db_root_password.txt

      - name: Despliegue Final en AWS
        run: |
          docker compose down --remove-orphans
          docker compose up -d --build
          docker image prune -f