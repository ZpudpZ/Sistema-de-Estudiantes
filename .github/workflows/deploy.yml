name: CI/CD

on:
  push:
    branches: [ "main", "feature/*" ]

jobs:
  deploy-local:
    runs-on: self-hosted

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Limpieza Extrema de Disco
        run: |
          docker compose down -v --remove-orphans
          docker system prune -a -f
          docker builder prune -a -f
        continue-on-error: true

      - name: Configurar Secretos
        shell: bash
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASSWORD }}
          ROOT_PASS: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          mkdir -p secrets
          rm -rf secrets/*.txt
          printf "%s" "$DB_NAME" > secrets/db_name.txt
          printf "%s" "$DB_USER" > secrets/db_user.txt
          printf "%s" "$DB_PASS" > secrets/db_password.txt
          printf "%s" "$ROOT_PASS" > secrets/db_root_password.txt
          chmod 600 secrets/*.txt

      - name: Ejecutar Pruebas en Docker
        run: |
          docker compose build web
          docker compose run --rm --entrypoint "sh -c" web "pip install pytest httpx coverage && export PYTHONPATH=/app && pytest tests/ -v"

      - name: Despliegue Final
        if: success()
        run: |
          docker compose down --remove-orphans
          sleep 5
          docker compose up -d --build
          docker image prune -f

      - name: Limpieza en Fallo
        if: failure()
        run: |
          docker compose down -v